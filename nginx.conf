# Upstream configuration for your Go API
upstream counter_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# These directives are evaluated in nginx's http context because this file is
# installed under /etc/nginx/sites-enabled and included from that context.
# Cloudflare is the only trusted source for the visitor IP header.
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Per-client request quota. The application applies the authoritative quota;
# this is an early edge rejection and deliberately returns 429.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Bound concurrent origin work separately. Connection pressure returns 503 so
# clients can distinguish service overload from their own quota exhaustion.
limit_conn_zone $server_name zone=origin_connections:10m;

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # SSL certificates (use Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/api.example.com-access.log;
    error_log /var/log/nginx/api.example.com-error.log;

    # Client body size limit
    client_max_body_size 64k;
	client_header_timeout 10s;
	client_body_timeout 10s;
	send_timeout 10s;

    limit_req_status 429;
    limit_conn_status 503;
    limit_conn origin_connections 100;

    # Proxy settings
    location / {
        # Apply nginx rate limiting (optional, app also does rate limiting)
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy to your Go API
        proxy_pass http://counter_api;

        # Pass real client IP headers (CRITICAL for rate limiting)
        # Replace, rather than append to, client-controlled forwarding headers.
        # $remote_addr is the canonical address after the Cloudflare real-IP
        # module has validated the immediate peer.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # Buffering
        proxy_buffering on;
        proxy_request_buffering on;

        # Keep-alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://counter_api/health;
        access_log off;
    }

    # Don't log health checks
    location = /health {
        access_log off;
        log_not_found off;
        proxy_pass http://counter_api/health;
    }
}
