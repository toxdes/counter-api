docs: |-
  # V2 Get Counter

  Reads the current counter value using a tenant-scoped credential with the
  `counter:read` scope. V2 reads use the configured bounded read-through cache;
  see the deployment guide for cache configuration and consistency behavior.

  ## Request
  ```http
  GET /v2/tenants/{tenant_id}/counters/{counter_id}
  X-API-Key: tenant-scoped-key
  ```

  V2 is the recommended contract for new clients. See `docs/api-v2.md` for the
  canonical contract; mutations require an `Idempotency-Key`.
