docs: |-
  # Increment Counter

  Increments a counter value by a specified delta amount. Useful for tracking events like page views, clicks, or any countable metric.

  **Authentication:** None required (public endpoint)

  **Rate Limit:** 30 requests per minute (configurable via RATE_LIMIT_GET_MULTIPLIER)

  ## URL Parameters
  - `tenant_id` (UUID, required): The unique identifier of the tenant
  - `counter_id` (UUID, required): The unique identifier of the counter

  ## Query Parameters
  - `delta` (integer, optional): Amount to increment by (default: 1, must be positive)
    - Example: `?delta=5` increments by 5

  ## Response (200 OK)
  ```json
  {
    "counter_id": "41537842-e463-45af-9ac9-8e4639aa85d2",
    "value": 1524,
    "updated_at": "2026-04-08T10:35:50Z"
  }
  ```

  ## Errors
  - 400 INVALID_UUID - Invalid tenant_id or counter_id format
  - 400 INVALID_DELTA - Delta parameter is not a positive integer
  - 404 COUNTER_NOT_FOUND - Counter does not exist
  - 400 COUNTER_OVERFLOW - Increment would cause integer overflow
  - 429 RATE_LIMIT_EXCEEDED - Too many requests

  ## Examples
  - Increment by 1: `POST .../inc` (defaults to delta=1)
  - Increment by 5: `POST .../inc?delta=5`
  - Increment by 10: `POST .../inc?delta=10`
