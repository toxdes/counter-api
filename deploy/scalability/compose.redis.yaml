services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  api1:
    environment:
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0

  api2:
    environment:
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0

  api3:
    environment:
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
