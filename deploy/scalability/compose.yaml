name: counter-scalability

x-api: &api
  build:
    context: ../..
  environment: &api-environment
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: 8080
    DATABASE_URL: postgres://counter_runtime:local-only-runtime@postgres:5432/counter?sslmode=disable
    DB_MAX_OPEN_CONNS: 5
    DB_MAX_IDLE_CONNS: 1
    API_KEY: local-scalability-test-key
    LEGACY_API_KEY_ENABLED: "true"
    RATE_LIMIT_REQUESTS: 10000
    RATE_LIMIT_GET_MULTIPLIER: 3
    RATE_LIMIT_WINDOW: 60
    RATE_LIMIT_CLEANUP: 300
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1::5432"
    environment:
      POSTGRES_DB: counter
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: local-only-counter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  roles:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: local-only-counter
    command: ["psql", "--set", "ON_ERROR_STOP=1", "--host", "postgres", "--username", "counter", "--dbname", "counter", "--file", "/setup-roles.sql"]
    volumes:
      - ./setup-roles.sql:/setup-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ../..
    environment:
      <<: *api-environment
      DATABASE_URL: postgres://counter:local-only-counter@postgres:5432/counter?sslmode=disable
    command: ["--db-migrate=up"]
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: "no"

  api1:
    <<: *api
    ports:
      - "127.0.0.1::8080"

  api2:
    <<: *api
    ports:
      - "127.0.0.1::8080"

  api3:
    <<: *api
    ports:
      - "127.0.0.1::8080"

  load-balancer:
    image: haproxy:3.2-alpine
    ports:
      - "127.0.0.1::8080"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  postgres-data:
